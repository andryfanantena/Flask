{% extends "base.html" %} 
{% block contenu %} 
    <h1>Nouvelle tâche</h1> 
    {% if erreur %}
        <p role="alert">{{ erreur }}</p>
    {% endif %}
    <form method="post"> 
        <input name="titre" placeholder="Titre" value="{{ titre }}" maxlength="80" required> 
        <select name="priorite"> 
            <option value="basse" {% if priorite == "basse" %}selected{% endif %}>basse</option> 
            <option value="normale" {% if priorite == "normale" %}selected{% endif %}>normale</option> 
            <option value="haute" {% if priorite == "haute" %}selected{% endif %}>haute</option> 
        </select> 
        <button>Ajouter</button> 
    </form> 
{% endblock %}
